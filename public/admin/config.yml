# 此檔案由 scripts/generate-cms-config.mjs 自動產生，請修改根目錄的 cms.config.mjs。
backend:
  name: github
  repo: "ntutcsiesa/ntut-csie-25"
  branch: "main"
  site_domain: "ntutcsie.pages.dev"
  base_url: "https://ntutcsie.pages.dev"
  auth_endpoint: /auth

site_url: "https://ntutcsie.pages.dev"
display_url: "https://ntutcsie.pages.dev"
logo_url: "https://ntutcsie.pages.dev/favicon.svg"

# 本機搭配 npx decap-server 時，直接讀寫目前的 Git Repository。
local_backend: true

media_folder: "public/uploads"
public_folder: "/uploads"

collections:
  - name: "news"
    label: "最新消息"
    label_singular: "文章"
    description: "管理首頁與 NEWS 頁面顯示的文章。"
    folder: "src/content/news"
    create: true
    extension: md
    format: frontmatter
    slug: "{{slug}}"
    preview_path: "news/{{slug}}/"
    summary: "{{pubDate}}｜{{title}}"
    sortable_fields:
      - pubDate
      - title
    editor:
      preview: false
    fields:
      - label: 標題
        name: title
        widget: string
      - label: 簡短說明
        name: description
        widget: text
        hint: 顯示在首頁及 NEWS 列表，建議使用一至兩句話。
      - label: 發布日期
        name: pubDate
        widget: datetime
        format: YYYY-MM-DD
        date_format: YYYY-MM-DD
        time_format: false
      - label: 文章內容
        name: body
        widget: markdown
